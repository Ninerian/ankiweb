<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Anmelden — AnkiWeb</title>
  <script>
    const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');
    const applyTheme = () => {
      document.documentElement.dataset.theme = colorScheme.matches ? 'dark' : 'light';
    };
    applyTheme();
    colorScheme.addEventListener('change', applyTheme);
  </script>
  <style>
    :root {
      --font-display: -apple-system, BlinkMacSystemFont, "Trebuchet MS", "Impact", "Segoe UI", system-ui, sans-serif;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg-base: #f4f3ed;
      --bg-surface: #ffffff;
      --text-main: #18191f;
      --text-muted: #5f6368;
      --border-color: #18191f;
      --border-width: 2.5px;
      --shadow-card: 4px 4px 0px var(--border-color);
      --shadow-button: 3px 3px 0px var(--border-color);
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 999px;
      --color-primary: #1971c2;
      --color-accent: #ffd13b;
      --color-accent-text: #18191f;
      --dot: rgba(24, 25, 31, 0.14);
      --streak-bg: #fff0eb;
      --again-bg: #ffe3e3;
      --again-border: #fa5252;
      --again-text: #a62222;
      --hard-bg: #fff3bf;
      --good-bg: #d3f9d8;
      --good-border: #40c057;
      --good-text: #145b24;
      --easy-bg: #d0ebff;
    }

    [data-theme="dark"] {
      --bg-base: #121316;
      --bg-surface: #1e2025;
      --text-main: #f8f9fa;
      --text-muted: #a1a6b0;
      --border-color: #f8f9fa;
      --shadow-card: 4px 4px 0px #000000;
      --shadow-button: 3px 3px 0px #000000;
      --color-primary: #74c0fc;
      --dot: rgba(248, 249, 250, 0.1);
      --streak-bg: #2b170c;
      --again-bg: #381519;
      --again-border: #ff6b6b;
      --again-text: #ffbdbd;
      --hard-bg: #382c0b;
      --good-bg: #0f361a;
      --good-border: #51cf66;
      --good-text: #8ce99a;
      --easy-bg: #0c2b45;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { background: var(--bg-base); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background-color: var(--bg-base);
      background-image: radial-gradient(var(--dot) 1.6px, transparent 1.8px);
      background-size: 22px 22px;
      color: var(--text-main);
      font-family: var(--font-ui);
      line-height: 1.4;
    }

    .app-viewport {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      /* Top and bottom gutters hold the stickers so they never touch the content. */
      padding: calc(env(safe-area-inset-top) + 84px) 22px calc(env(safe-area-inset-bottom) + 84px) 20px;
    }

    /* ---------- Decorative sticker chips ---------- */
    .sticker {
      position: absolute;
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border: var(--border-width) solid var(--border-color);
      border-radius: 14px;
      box-shadow: var(--shadow-button);
      font-size: 1.55rem;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      animation: stickerFloat 5.5s ease-in-out infinite;
      animation-delay: var(--d, 0s);
    }
    .sticker-star  { top: calc(env(safe-area-inset-top) + 14px);    right: 8%; background: var(--hard-bg);   --r: 10deg;  --d: -1s; }
    .sticker-book  { top: calc(env(safe-area-inset-top) + 22px);    left: 9%;  background: var(--easy-bg);   --r: -8deg;  --d: -3s; width: 42px; height: 42px; font-size: 1.3rem; }
    .sticker-fire  { bottom: calc(env(safe-area-inset-bottom) + 14px); right: 9%; background: var(--streak-bg); --r: 8deg;   --d: -2s; }
    .sticker-brain { bottom: calc(env(safe-area-inset-bottom) + 20px); left: 8%;  background: var(--good-bg);   --r: -10deg; --d: -4s; width: 44px; height: 44px; font-size: 1.35rem; }
    @keyframes stickerFloat {
      0%, 100% { transform: translateY(0) rotate(var(--r)); }
      50%      { transform: translateY(-9px) rotate(calc(var(--r) * -0.5)); }
    }

    /* ---------- Hero ---------- */
    .hero { position: relative; z-index: 2; margin-bottom: 52px; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    h1 {
      margin: 0 0 12px;
      max-width: 9.5em;
      font-family: var(--font-display);
      font-size: 2.35rem;
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 900;
    }
    h1 .wave { display: inline-block; transform-origin: 70% 80%; animation: wave 2.4s ease-in-out 0.8s 2; }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0); }
      10%, 30%, 50% { transform: rotate(16deg); }
      20%, 40%      { transform: rotate(-10deg); }
    }
    .lede { margin: 0; max-width: 20em; color: var(--text-muted); font-size: 0.98rem; font-weight: 600; }

    /* ---------- Card stack ---------- */
    .stage { position: relative; z-index: 2; margin: 0 4px 0 0; animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.12s both; }
    .ghost {
      position: absolute;
      inset: 0;
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }
    .ghost-1 { background: var(--easy-bg); transform: translate(9px, 16px) rotate(3.2deg); }
    .ghost-2 { background: var(--hard-bg); transform: translate(-7px, 9px) rotate(-2.8deg); }

    .login-card {
      position: relative;
      padding: 52px 20px 22px;
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
      box-shadow: var(--shadow-card);
    }
    .login-card.is-shaking { animation: wobble 0.5s ease; }
    @keyframes wobble {
      0%, 100% { transform: translateX(0) rotate(0); }
      18% { transform: translateX(-9px) rotate(-1.2deg); }
      36% { transform: translateX(8px) rotate(1deg); }
      54% { transform: translateX(-6px) rotate(-0.6deg); }
      72% { transform: translateX(4px) rotate(0.4deg); }
    }

    .mascot {
      position: absolute;
      top: -34px;
      left: 20px;
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border: var(--border-width) solid var(--border-color);
      border-radius: 20px;
      background: var(--color-accent);
      box-shadow: var(--shadow-button);
      font-size: 2.1rem;
      line-height: 1;
      transform: rotate(-7deg);
      animation: mascotBob 3.6s ease-in-out infinite;
    }
    .mascot span { display: block; animation: emojiPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .mascot[data-mood="error"]   { background: var(--again-bg); }
    .mascot[data-mood="success"] { background: var(--good-bg); }
    @keyframes mascotBob {
      0%, 100% { transform: rotate(-7deg) translateY(0); }
      50%      { transform: rotate(-4deg) translateY(-4px); }
    }
    @keyframes emojiPop {
      0% { transform: scale(0.4) rotate(-20deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .card-title {
      margin: 0 0 3px;
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .card-hint { margin: 0 0 18px; color: var(--text-muted); font-size: 0.88rem; font-weight: 600; }

    .field-label {
      display: block;
      margin: 0 0 7px;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .field-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 14px;
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-base);
      box-shadow: 2px 2px 0 var(--border-color);
    }
    .field-box:focus-within { outline: 3px solid var(--color-primary); outline-offset: 3px; }
    .field-box.has-error { border-color: var(--again-border); box-shadow: 2px 2px 0 var(--again-border); }
    .field-box .key { font-size: 1.15rem; line-height: 1; }
    .field-box input {
      flex: 1;
      min-width: 0;
      padding: 15px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text-main);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .field-box input::placeholder { color: var(--text-muted); font-weight: 600; opacity: 1; }
    .field-box input[type="password"]:not(:placeholder-shown) { letter-spacing: 0.14em; }

    .btn-peek {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 38px;
      padding: 0 11px;
      border: var(--border-width) solid var(--border-color);
      border-radius: 12px;
      background: var(--bg-surface);
      box-shadow: 2px 2px 0 var(--border-color);
      color: var(--text-main);
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .btn-peek:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--border-color); }
    .btn-peek[aria-pressed="true"] { background: var(--easy-bg); }
    .btn-peek:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 3px; }

    .alert {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 14px 0 0;
      padding: 10px 12px;
      border: var(--border-width) solid var(--again-border);
      border-radius: 14px;
      background: var(--again-bg);
      color: var(--again-text);
      font-size: 0.9rem;
      font-weight: 800;
      animation: emojiPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .alert .emo { font-size: 1.25rem; line-height: 1; }

    .btn-login {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 62px;
      margin-top: 20px;
      padding: 0 18px;
      border: 3px solid var(--border-color);
      border-radius: var(--radius-lg);
      background: var(--color-accent);
      box-shadow: var(--shadow-button);
      color: var(--color-accent-text);
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s ease;
    }
    .btn-login .go { font-size: 1.35rem; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-login:hover .go { transform: translate(3px, -3px) rotate(8deg); }
    .btn-login:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--border-color); }
    .btn-login:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 3px; }
    .btn-login.is-success { background: var(--good-bg); color: var(--good-text); }

    /* Confetti emojis for the success state */
    .confetti { position: absolute; left: 54px; top: -4px; pointer-events: none; }
    .confetti i {
      position: absolute;
      font-style: normal;
      font-size: 1.2rem;
      animation: burst 1s ease-out forwards;
    }
    @keyframes burst {
      0%   { transform: translate(0, 0) scale(0.4) rotate(0); opacity: 1; }
      100% { transform: translate(var(--x), var(--y)) scale(1.1) rotate(var(--rot)); opacity: 0; }
    }

    @keyframes popIn {
      0%   { transform: translateY(18px) scale(0.96); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .sticker, .mascot, .hero, .stage, h1 .wave, .alert, .mascot span { animation: none; }
      .login-card.is-shaking { animation: none; }
      .confetti { display: none; }
      .btn-login, .btn-peek, .btn-login .go { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app-viewport">
    <div aria-hidden="true">
      <div class="sticker sticker-star">⭐</div>
      <div class="sticker sticker-book">📚</div>
      <div class="sticker sticker-fire">🔥</div>
      <div class="sticker sticker-brain">🧠</div>
    </div>

    <header class="hero">
      <h1>Hey, schön dass du da bist! <span class="wave" aria-hidden="true">👋</span></h1>
      <p class="lede">Mit deinem Passwort öffnest du deine Karten.</p>
    </header>

    <section class="stage" aria-labelledby="login-title">
      <div class="ghost ghost-1" aria-hidden="true"></div>
      <div class="ghost ghost-2" aria-hidden="true"></div>

      <form id="login" class="login-card" method="post" action="/app/login" novalidate>
        <div class="mascot" id="mascot" data-mood="idle" aria-hidden="true"><span>🔐</span></div>
        <div class="confetti" id="confetti" aria-hidden="true"></div>

        <h2 id="login-title" class="card-title">Anmelden</h2>
        <p class="card-hint">Nur ein Passwort. Kein Konto, kein Stress.</p>

        <label class="field-label" for="password">Passwort</label>
        <div class="field-box" id="field">
          <span class="key" aria-hidden="true">🔑</span>
          <input id="password" name="password" type="password" placeholder="Passwort"
                 autocomplete="current-password" autocapitalize="none" spellcheck="false"
                 enterkeyhint="go" autofocus aria-describedby="login-error">
          <button type="button" class="btn-peek" id="peek" aria-pressed="false" aria-controls="password">
            <span aria-hidden="true" id="peek-icon">👁️</span><span id="peek-label">Zeigen</span>
          </button>
        </div>

        <div id="login-error" role="alert">
          <p class="alert" id="alert" hidden><span class="emo" aria-hidden="true">😬</span><span id="alert-text"></span></p>
        </div>

        <button type="submit" class="btn-login" id="submit">
          <span id="submit-label">Anmelden</span> <span class="go" aria-hidden="true" id="submit-emoji">🚀</span>
        </button>
      </form>
    </section>

  </main>

  <script>
    // Mock only: the right password is "anki". `#error` / `#success` in the URL preview a state.
    const MESSAGES = {
      wrong: 'Passwort falsch. Versuch es nochmal!',
      empty: 'Bitte gib dein Passwort ein.',
    };
    const $ = (id) => document.getElementById(id);
    const form = $('login'), input = $('password'), field = $('field');
    const mascot = $('mascot'), alertEl = $('alert'), alertText = $('alert-text');
    const submit = $('submit'), peek = $('peek');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

    function setMood(mood, emoji) {
      mascot.dataset.mood = mood;
      mascot.firstElementChild.textContent = emoji;
      // Replay the pop animation on each change.
      mascot.firstElementChild.style.animation = 'none';
      void mascot.firstElementChild.offsetWidth;
      mascot.firstElementChild.style.animation = '';
    }

    function idleMood() {
      const shown = input.type === 'text';
      if (!input.value) return setMood('idle', '🔐');
      setMood('idle', shown ? '👀' : '🤫');
    }

    function showError(kind) {
      alertText.textContent = MESSAGES[kind];
      $('alert').querySelector('.emo').textContent = kind === 'empty' ? '🙈' : '😬';
      alertEl.hidden = false;
      field.classList.add('has-error');
      input.setAttribute('aria-invalid', 'true');
      setMood('error', kind === 'empty' ? '🙈' : '🙅');
      if (!reduced.matches) {
        form.classList.remove('is-shaking');
        void form.offsetWidth;
        form.classList.add('is-shaking');
      }
      input.focus();
      input.select();
    }

    function clearError() {
      alertEl.hidden = true;
      field.classList.remove('has-error');
      input.removeAttribute('aria-invalid');
    }

    function showSuccess() {
      clearError();
      setMood('success', '🎉');
      submit.classList.add('is-success');
      $('submit-label').textContent = 'Willkommen!';
      $('submit-emoji').textContent = '🎉';
      if (reduced.matches) return;
      const box = $('confetti');
      box.replaceChildren(...['🎉', '⭐', '✨', '🔥', '📚', '💛', '🧠', '⚡'].map((e, i) => {
        const el = document.createElement('i');
        const angle = (i / 8) * Math.PI * 2 - Math.PI / 2;
        el.textContent = e;
        el.style.setProperty('--x', `${Math.cos(angle) * 78}px`);
        el.style.setProperty('--y', `${Math.sin(angle) * 78}px`);
        el.style.setProperty('--rot', `${(i % 2 ? 1 : -1) * 40}deg`);
        el.style.animationDelay = `${i * 30}ms`;
        return el;
      }));
    }

    input.addEventListener('input', () => { clearError(); idleMood(); });

    peek.addEventListener('click', () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      peek.setAttribute('aria-pressed', String(show));
      $('peek-icon').textContent = show ? '🙈' : '👁️';
      $('peek-label').textContent = show ? 'Verbergen' : 'Zeigen';
      if (mascot.dataset.mood === 'idle') idleMood();
      input.focus();
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (submit.classList.contains('is-success')) return;
      if (!input.value) return showError('empty');
      if (input.value !== 'anki') return showError('wrong');
      showSuccess();
    });

    // URL hash previews a state for review and screenshots.
    if (location.hash === '#error') { input.value = 'falsch'; showError('wrong'); }
    if (location.hash === '#success') { input.value = 'anki'; showSuccess(); }
  </script>
</body>
</html>
