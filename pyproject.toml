[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ankiweb"
version = "0.1.0"
requires-python = ">=3.12"
# Derivative of Anki (AGPL-3.0-or-later) + AnkiConnect (GPL-3.0-or-later); the combined
# work is AGPL-3.0-or-later. See LICENSE + THIRD-PARTY-NOTICES.md.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "tsc", email = "xxj.tan@gmail.com" }]
classifiers = ["Programming Language :: Python :: 3.12", "Framework :: FastAPI"]
dependencies = [
  "anki==26.9.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",          # uvicorn needs a WS library for real /ws connections (the bridge)
  "httpx>=0.27",
  "python-multipart>=0.0.9", # FastAPI UploadFile (the /upload_media paste-image endpoint)
  "jinja2>=3.1",
  "datastar-py>=1.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.44"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.setuptools.packages.find]
include = ["ankiweb*"]

[tool.setuptools.package-data]
ankiweb = ["adapters/inbound/http_shared/templates/*.html.jinja"]

[tool.djlint]
profile = "jinja"
# H021 (inline styles), H050 (<center>), J018 (url_for pattern) are the project's deliberate,
# pre-existing markup idiom (this is a raw jinja2.Environment over FastAPI, not Flask — there is
# no url_for; every screen was byte-transcribed from the original hand-written HTML strings that
# already used inline styles and <center> for layout). Rewriting the whole app's CSS/markup
# architecture to satisfy a generic linter is out of scope and would risk regressing tests that
# assert on rendered markup substrings.
ignore = "H008,H011,H015,H021,H023,H050,J018"
