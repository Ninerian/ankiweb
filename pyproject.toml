[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ankiweb"
version = "0.1.0"
requires-python = ">=3.12"
# Derivative of Anki (AGPL-3.0-or-later) + AnkiConnect (GPL-3.0-or-later); the combined
# work is AGPL-3.0-or-later. See LICENSE + THIRD-PARTY-NOTICES.md.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "tsc", email = "xxj.tan@gmail.com" }]
classifiers = ["Programming Language :: Python :: 3.12", "Framework :: FastAPI"]
dependencies = [
  "anki==26.9.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",          # uvicorn needs a WS library for real /ws connections (the bridge)
  "httpx>=0.27",
  "python-multipart>=0.0.9", # FastAPI UploadFile (the /upload_media paste-image endpoint)
  "jinja2>=3.1",
  "datastar-py>=1.0.2",
  "starlette-compress>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "playwright>=1.44",
    "ty>=0.0.92",
    "ruff>=0.17.3",
    "complexipy>=8.3.0",
    "pre-commit>=4.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.complexipy]
paths = ["ankiweb", "tests", "tools"]
max-complexity-allowed = 15
failed = true
sort = "desc"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
preview = true
select = [
    "correctness",
    "suspicious",
    "complexity",
    "performance",
    "style",
    "security"
]

[tool.ruff.lint.per-file-ignores]
# Bind-address strings exercise config loading only; no server is bound.
"tests/ankiconnect/test_config_env.py" = ["S104"]
# Synthetic webhook tokens exercise request validation and persistence.
"tests/ankiconnect/test_extra_actions.py" = ["S105", "S106"]
# The unsupported GUI import rejects this path without opening it.
"tests/ankiconnect/test_gui_actions.py" = ["S108"]
# MD5 is the non-security AnkiConnect skipHash compatibility checksum.
"tests/ankiconnect/test_media_actions.py" = ["S324"]
# Synthetic password exercises the local authentication fixture.
"tests/test_auth.py" = ["S105"]
# A fixed interpreter and fixed code verify initialization in a fresh process.
"tests/test_i18n.py" = ["S404", "S603"]
# Resolved npm runs fixed repository build scripts in an isolated temporary tree.
"tests/test_shell_build.py" = ["S404", "S603"]
# Synthetic webhook token exercises notifier configuration and transport.
"tests/test_notifier.py" = ["S106"]
# Synthetic webhook token exercises the notification settings form.
"tests/test_notify_screen.py" = ["S105"]
# XML parsing inspects SVG generated by the application from the test collection.
"tests/test_pages_graphs.py" = ["S405", "S314"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false


[tool.setuptools.packages.find]
include = ["ankiweb*"]

[tool.setuptools.package-data]
ankiweb = ["adapters/inbound/http_shared/templates/*.html.jinja"]

[tool.djlint]
profile = "jinja"
# H021 (inline styles), H050 (<center>), J018 (url_for pattern) are the project's deliberate,
# pre-existing markup idiom (this is a raw jinja2.Environment over FastAPI, not Flask — there is
# no url_for; every screen was byte-transcribed from the original hand-written HTML strings that
# already used inline styles and <center> for layout). Rewriting the whole app's CSS/markup
# architecture to satisfy a generic linter is out of scope and would risk regressing tests that
# assert on rendered markup substrings.
ignore = "H008,H011,H015,H021,H023,H050,J018"
