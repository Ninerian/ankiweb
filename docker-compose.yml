---
services:
  ankiweb:
    build: .
    container_name: ankiweb
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${ANKIWEB_HOST_PORT:-8000}:8000"
      - "${ANKIWEB_AC_HOST_PORT:-8765}:8765"
    volumes:
      - "${DATA_DIRECTORY}:/data"
      - type: tmpfs
        target: /tmp
    environment:
      TZ: ${TZ:-UTC}
      ANKIWEB_PASSWORD: ${ANKIWEB_PASSWORD:-}
      ANKIWEB_AC_KEY: ${ANKIWEB_AC_KEY:-}
      ANKIWEB_HOST: ${ANKIWEB_HOST:-0.0.0.0}
      ANKIWEB_ALLOWED_HOSTS: ${ANKIWEB_ALLOWED_HOSTS:-}
      ANKIWEB_LANG: ${ANKIWEB_LANG:-de}
      ANKIWEB_SOURCE_URL: ${ANKIWEB_SOURCE_URL:-}
      ANKIWEB_COLLECTION: ${ANKIWEB_COLLECTION:-/data}
      ANKIWEB_IMPORT_TMP_DIR: ${ANKIWEB_IMPORT_TMP_DIR:-/tmp/anki}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
